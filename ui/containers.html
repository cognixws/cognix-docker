<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docker</title>
<link rel="stylesheet" href="../__picode/tokens.css">
<link rel="stylesheet" href="docker.css">
</head>
<body>
<div class="dk-root" id="dk-root">
  <header class="dk-top">
    <div class="dk-head-row">
      <div class="dk-title-blk">
        <h1 class="dk-title">Docker</h1>
        <div class="dk-live-summary" id="dk-summary" role="status">Connecting…</div>
      </div>
      <div class="dk-actions-row">
        <button class="dk-btn" type="button" id="dk-open-compose-btn">Compose stack</button>
        <button class="dk-btn" type="button" id="dk-refresh-btn">Refresh</button>
      </div>
    </div>
    <nav class="dk-tabs" role="tablist" aria-label="Docker sections">
      <button class="dk-tab" type="button" role="tab" data-view="stacks" aria-selected="true">
        <span>Stacks</span>
        <span class="dk-badge" id="dk-badge-stacks" hidden></span>
      </button>
      <button class="dk-tab" type="button" role="tab" data-view="health" aria-selected="false">
        <span>Health</span>
        <span class="dk-badge is-danger" id="dk-badge-health" hidden></span>
      </button>
      <button class="dk-tab" type="button" role="tab" data-view="resources" aria-selected="false">
        <span>Resources</span>
        <span class="dk-badge" id="dk-badge-resources" hidden></span>
      </button>
      <button class="dk-tab" type="button" role="tab" data-view="plans" aria-selected="false">
        <span>Plans</span>
        <span class="dk-badge is-warn" id="dk-badge-plans" hidden></span>
      </button>
    </nav>
  </header>

  <div class="dk-body">
    <main class="dk-main" id="dk-main"></main>
    <aside class="dk-inspector" id="dk-inspector" aria-label="Inspector" hidden></aside>
  </div>

  <div class="dk-toast" id="dk-toast" role="status" aria-live="polite" hidden></div>
</div>

<dialog class="dk-modal" id="dk-compose-dialog" aria-label="Register Compose stack">
  <form novalidate id="dk-compose-form">
    <h3>Compose stack</h3>
    <p class="dk-modal-sub">Preview and reconcile a Docker Compose folder inside an enabled workspace. Volumes are preserved.</p>
    <label class="dk-field">
      <span>Workspace folder</span>
      <input class="dk-field-in" id="dk-cmp-dir" type="text" placeholder="/path/to/workspace/service" autocomplete="off">
    </label>
    <label class="dk-field">
      <span>Stack name (optional)</span>
      <input class="dk-field-in" id="dk-cmp-proj" type="text" maxlength="63" placeholder="Defaults to folder name" autocomplete="off">
    </label>
    <label class="dk-field">
      <span>Compose files (optional, comma-separated)</span>
      <input class="dk-field-in" id="dk-cmp-files" type="text" placeholder="compose.yml" autocomplete="off">
    </label>
    <div id="dk-cmp-preview" class="dk-cmp-preview" hidden></div>
    <p class="dk-form-err" id="dk-cmp-err" role="alert" hidden></p>
    <div class="dk-modal-foot">
      <button class="dk-btn" type="button" id="dk-cmp-cancel">Cancel</button>
      <button class="dk-btn" type="button" id="dk-cmp-check">Preview diff</button>
      <button class="dk-btn is-primary" type="submit" id="dk-cmp-deploy">Deploy stack</button>
    </div>
  </form>
</dialog>

<script src="docker.js"></script>
</body>
</html>
